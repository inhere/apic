name: Tag-release

on:
  push:
    tags:
      - v*

# The default token of a new repository is read-only; creating a release needs write.
permissions:
  contents: write

jobs:
  release:
    name: Release new version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go Faster
        uses: WillAbides/setup-go-faster@v1.19.0
        timeout-minutes: 3
        with:
          go-version: stable


      - name: Setup ENV
        # https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-commands-for-github-actions#setting-an-environment-variable
        run: |
          echo "RELEASE_TAG=${GITHUB_REF:10}" >> $GITHUB_ENV
          echo "RELEASE_NAME=$GITHUB_WORKFLOW" >> $GITHUB_ENV

      - name: Mod tidy
        run: |
          go mod tidy


      - name: Build bin package
        run: |
          make build-all
          ./dist/apic-linux-amd64 --version

      - name: Generate changelog
        run: |
          curl https://github.com/gookit/gitw/releases/latest/download/chlog-linux-amd64 -L -o /usr/local/bin/chlog
          chmod a+x /usr/local/bin/chlog
          # The first release has no previous tag; start from the root commit then.
          # chlog only prints an error in that case, so check the file exists.
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          chlog -c .github/changelog.yml -o changelog.md "$prev" "$RELEASE_TAG"
          test -s changelog.md

      # https://github.com/softprops/action-gh-release
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: changelog.md
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/*
